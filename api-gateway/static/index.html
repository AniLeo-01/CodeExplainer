<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Chat Agent</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header svg {
      width: 32px;
      height: 32px;
      fill: var(--text);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header .status-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.green { background: var(--green); }
    .status-dot.yellow { background: var(--yellow); }
    .status-dot.red { background: var(--red); }
    .status-dot.grey { background: var(--text-muted); }

    .status-label {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 340px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 14px;
      font-weight: 600;
      padding: 16px 16px 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .index-form {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .index-form input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .index-form input:focus {
      border-color: var(--accent);
    }

    .index-form input::placeholder {
      color: var(--text-muted);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Index status */
    .index-status {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    .index-status .status-bar {
      margin-top: 8px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
    }

    .index-status .status-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .index-status .status-bar-fill.running {
      background: var(--yellow);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .index-status .status-bar-fill.completed { background: var(--green); width: 100%; }
    .index-status .status-bar-fill.failed { background: var(--red); width: 100%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; width: 30%; }
      50% { opacity: 0.6; width: 70%; }
    }

    /* Graph stats */
    .graph-stats {
      padding: 12px 16px;
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    .graph-stats .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .graph-stats .stat-value {
      color: var(--accent);
      font-weight: 600;
    }

    /* Agent health */
    .agent-health {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex: 1;
    }

    .agent-health h3 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 13px;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
      padding: 24px;
    }

    .welcome svg {
      width: 64px;
      height: 64px;
      fill: var(--border);
    }

    .welcome h2 {
      font-size: 20px;
      color: var(--text);
    }

    .welcome p {
      font-size: 14px;
      max-width: 440px;
      text-align: center;
      line-height: 1.6;
    }

    /* Chat input */
    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-input-area textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
    }

    .chat-input-area textarea:focus {
      border-color: var(--accent);
    }

    .chat-input-area textarea::placeholder {
      color: var(--text-muted);
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      gap: 4px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; max-height: 200px; overflow-y: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    <h1>GitHub Repo Chat Agent</h1>
    <div class="status-group">
      <span class="status-label" id="indexStatusHeader">
        <span class="status-dot grey"></span>
        No repo indexed
      </span>
    </div>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Index Repository</h2>
      <div class="index-form">
        <input type="text" id="repoUrl" placeholder="https://github.com/owner/repo.git" />
        <button class="btn" id="indexBtn" onclick="startIndexing()">Index Repository</button>
      </div>

      <div class="index-status" id="indexStatusPanel" style="display:none;">
        <div id="indexStatusText">Indexing...</div>
        <div class="status-bar">
          <div class="status-bar-fill running" id="indexProgressBar"></div>
        </div>
      </div>

      <div class="graph-stats" id="graphStats">
        <div class="stat-row">
          <span>Nodes</span>
          <span class="stat-value" id="nodeCount">—</span>
        </div>
        <div class="stat-row">
          <span>Relationships</span>
          <span class="stat-value" id="relCount">—</span>
        </div>
      </div>

      <div class="agent-health">
        <h3>Agent Health</h3>
        <div id="agentList">
          <div class="agent-item"><span class="status-dot grey"></span> Loading...</div>
        </div>
      </div>
    </aside>

    <!-- Chat -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <svg viewBox="0 0 16 16"><path d="M1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0ZM8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm.5 4.75a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 .37.65l2.5 1.5a.75.75 0 1 0 .76-1.3L8.5 7.87V4.75Z"/></svg>
          <h2>Welcome!</h2>
          <p>Enter a GitHub repository URL in the sidebar and click <strong>Index Repository</strong> to get started. Once indexed, you can ask questions about the codebase.</p>
        </div>
        <div class="typing-indicator" id="typing">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="Ask about the codebase..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let sessionId = null;
    let indexPollTimer = null;

    // ========== Indexing ==========
    async function startIndexing() {
      const url = document.getElementById('repoUrl').value.trim();
      if (!url) return alert('Please enter a GitHub repository URL.');

      const btn = document.getElementById('indexBtn');
      btn.disabled = true;
      btn.textContent = 'Starting...';

      const panel = document.getElementById('indexStatusPanel');
      panel.style.display = 'block';
      document.getElementById('indexStatusText').textContent = 'Starting indexing...';
      const bar = document.getElementById('indexProgressBar');
      bar.className = 'status-bar-fill running';

      updateHeaderStatus('yellow', 'Indexing...');

      try {
        const res = await fetch(`${API}/api/index/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_url: url })
        });
        const data = await res.json();
        if (data.job_id) {
          pollIndexStatus(data.job_id);
        } else {
          throw new Error(data.detail || 'Failed to start indexing');
        }
      } catch (e) {
        document.getElementById('indexStatusText').textContent = `Error: ${e.message}`;
        bar.className = 'status-bar-fill failed';
        updateHeaderStatus('red', 'Error');
        btn.disabled = false;
        btn.textContent = 'Index Repository';
      }
    }

    function pollIndexStatus(jobId) {
      if (indexPollTimer) clearInterval(indexPollTimer);
      indexPollTimer = setInterval(async () => {
        try {
          const res = await fetch(`${API}/api/index/status/${jobId}`);
          const data = await res.json();
          const status = data.status;

          if (status === 'completed') {
            clearInterval(indexPollTimer);
            document.getElementById('indexStatusText').textContent = 'Indexing complete!';
            document.getElementById('indexProgressBar').className = 'status-bar-fill completed';
            document.getElementById('indexBtn').disabled = false;
            document.getElementById('indexBtn').textContent = 'Index Repository';
            updateHeaderStatus('green', 'Indexed');
            fetchGraphStats();
            addSystemMessage('Repository indexed successfully! You can now ask questions about the codebase.');
          } else if (status === 'failed') {
            clearInterval(indexPollTimer);
            document.getElementById('indexStatusText').textContent = `Failed: ${data.error || 'Unknown error'}`;
            document.getElementById('indexProgressBar').className = 'status-bar-fill failed';
            document.getElementById('indexBtn').disabled = false;
            document.getElementById('indexBtn').textContent = 'Index Repository';
            updateHeaderStatus('red', 'Failed');
          } else {
            document.getElementById('indexStatusText').textContent = `Status: ${status}...`;
          }
        } catch (e) {
          // Silently continue polling on network errors
        }
      }, 2000);
    }

    function updateHeaderStatus(color, text) {
      const el = document.getElementById('indexStatusHeader');
      el.innerHTML = `<span class="status-dot ${color}"></span> ${text}`;
    }

    // ========== Graph Stats ==========
    async function fetchGraphStats() {
      try {
        const res = await fetch(`${API}/api/graph/statistics`);
        const data = await res.json();
        document.getElementById('nodeCount').textContent = data.total_nodes?.toLocaleString() ?? '—';
        document.getElementById('relCount').textContent = data.total_relationships?.toLocaleString() ?? '—';
      } catch (e) {
        // ignore
      }
    }

    // ========== Agent Health ==========
    async function fetchAgentHealth() {
      const el = document.getElementById('agentList');
      try {
        const res = await fetch(`${API}/api/agents/health`);
        const data = await res.json();
        el.innerHTML = Object.entries(data)
          .map(([name, ok]) => `
            <div class="agent-item">
              <span class="status-dot ${ok ? 'green' : 'red'}"></span>
              ${name.replace(/_/g, ' ')}
            </div>
          `).join('');
      } catch (e) {
        el.innerHTML = '<div class="agent-item"><span class="status-dot red"></span> Cannot reach API</div>';
      }
    }

    // ========== Chat ==========
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      hideWelcome();
      addMessage(text, 'user');
      showTyping(true);

      try {
        const body = { message: text };
        if (sessionId) body.session_id = sessionId;

        const res = await fetch(`${API}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        showTyping(false);

        if (data.error) {
          addMessage(`Error: ${data.error}`, 'assistant');
        } else {
          sessionId = data.session_id || sessionId;
          const response = typeof data.response === 'string'
            ? data.response
            : JSON.stringify(data.response, null, 2);
          addMessage(response, 'assistant');
        }
      } catch (e) {
        showTyping(false);
        addMessage(`Connection error: ${e.message}`, 'assistant');
      }
    }

    function addMessage(text, role) {
      const container = document.getElementById('messages');
      const typing = document.getElementById('typing');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      container.insertBefore(div, typing);
      container.scrollTop = container.scrollHeight;
    }

    function addSystemMessage(text) {
      const container = document.getElementById('messages');
      const typing = document.getElementById('typing');
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = text;
      container.insertBefore(div, typing);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping(show) {
      document.getElementById('typing').classList.toggle('visible', show);
      if (show) {
        const container = document.getElementById('messages');
        container.scrollTop = container.scrollHeight;
      }
    }

    function hideWelcome() {
      const w = document.getElementById('welcome');
      if (w) w.style.display = 'none';
    }

    // Auto-resize textarea
    document.getElementById('chatInput').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // ========== Init ==========
    fetchGraphStats();
    fetchAgentHealth();
    setInterval(fetchAgentHealth, 30000);
  </script>
</body>
</html>
